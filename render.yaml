services:
  - type: web
    name: reka-api
    runtime: node
    plan: starter
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm --filter @reka/api... build
    startCommand: pnpm --filter @reka/api start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: reka-redis
          property: connectionString
      - key: WEB_URL
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: RP_ID
        sync: false
      - key: RP_ORIGIN
        sync: false
      - key: GITHUB_APP_ID
        sync: false
      - key: GITHUB_CLIENT_ID
        sync: false
      - key: GITHUB_CLIENT_SECRET
        sync: false
      - key: GITHUB_CALLBACK_URL
        sync: false
      - key: GITHUB_PRIVATE_KEY
        sync: false
      - key: GITHUB_WEBHOOK_SECRET
        sync: false
      - key: GITHUB_APP_SLUG
        sync: false

  - type: worker
    name: reka-worker
    runtime: node
    plan: starter
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm --filter @reka/worker... build
    startCommand: pnpm --filter @reka/worker start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: reka-redis
          property: connectionString

  - type: keyvalue
    name: reka-redis
    plan: starter
    maxmemoryPolicy: noeviction
